# Lint config used by CI (`ruff check .`). Ruff's classic default rule set:
# syntax errors, undefined names, unused imports/variables, bad comparisons...
# Style-only rules (import sorting, pyupgrade) are intentionally not enabled.
target-version = "py311"
line-length = 120
extend-exclude = ["node_modules", ".venv", "data", "public"]

[lint]
select = ["E4", "E7", "E9", "F"]
