name: Daily catalog refresh

on:
  schedule:
    # 06:30 Asia/Bangkok every day. GitHub cron is UTC.
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh shop catalogs
        run: python daily_refresh.py
      - name: Run tests and build public catalog
        run: |
          python -m pytest -q
          python build_static.py
          node --check public/app.js
          test -s public/data/wines.json
      - name: Publish rolling catalog branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wine.db public/data/wines.json
          refresh_date="$(TZ=Asia/Bangkok date +%F)"
          git commit -m "chore: refresh wine catalog ${refresh_date}"
          remote_sha="$(git ls-remote origin refs/heads/catalog | cut -f1)"
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/catalog:${remote_sha}" origin HEAD:catalog
          else
            git push origin HEAD:catalog
          fi
