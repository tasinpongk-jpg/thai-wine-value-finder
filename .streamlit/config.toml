[theme]
base = "dark"
primaryColor = "#B23047"
backgroundColor = "#14100E"
secondaryBackgroundColor = "#1E1714"
textColor = "#F2EAE0"
font = "sans serif"

[server]
headless = true
# Local only by default; the Dockerfile passes --server.address=0.0.0.0 itself.
address = "127.0.0.1"
port = 8501
# Keep Streamlit's CSRF/XSRF and CORS protection ON. Both work through a
# Cloudflare tunnel (same origin). Turning them off let any website you visit
# submit cellar changes to a running dashboard.
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false
