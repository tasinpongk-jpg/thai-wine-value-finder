# Fly.io config for the Thai Wine Value Finder.
# `fly launch --no-deploy` will set/confirm `app` and create the volume;
# then `fly deploy`.
#
# A Fly app is on the public internet, so it runs in PUBLIC (read-only) mode:
# the cellar is hidden. To use the cellar here instead, delete the
# WINEVALUE_PUBLIC_MODE line and set a password as a Fly secret:
#   fly secrets set WINEVALUE_CELLAR_PASSWORD='something-long'
# Visitors then need that password to see or change the cellar.
app = "thai-wine-value"
primary_region = "sin"  # Singapore — closest Fly region to Thailand

[build]

[env]
  WINEVALUE_CELLAR_DB = "/data/cellar.db"
  WINEVALUE_PUBLIC_MODE = "1"

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0   # scale to zero when idle (cheap; ~few-sec cold start)

  [http_service.concurrency]
    type = "connections"      # Streamlit uses a persistent websocket
    hard_limit = 50
    soft_limit = 40

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "40s"
    method = "GET"
    path = "/_stcore/health"

# persistent disk for the cellar (purchases + ratings)
[mounts]
  source = "winecellar_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
